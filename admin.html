<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | آکادمی دانش و ایمنی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Vazirmatn,sans-serif;background:#071a2d;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,88%);background:#fff;color:#182534;border-radius:16px;padding:35px;box-shadow:0 25px 80px #0005}.logo{font-size:26px;font-weight:800;color:#071a2d}.sub{color:#667585;font-size:12px;margin:5px 0 25px}label{display:block;font-size:11px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #dfe5ea;border-radius:7px;box-sizing:border-box;font-family:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:#c83232;color:#fff;font-family:inherit;font-weight:700}.note{margin-top:18px;padding:12px;background:#f3f5f7;border-radius:8px;color:#667585;font-size:10px;line-height:1.9}.back{display:block;margin-top:18px;text-align:center;color:#c83232;font-size:11px}</style></head><body><main class="box"><div class="logo">پنل مدیریت</div><div class="sub">آکادمی دانش و ایمنی آتش‌نشانی</div><label>نام کاربری</label><input value="akbaresalati" readonly><label>رمز عبور</label><input type="password" placeholder="پس از فعال‌سازی احراز هویت وارد می‌شود"><button type="button" onclick="alert('احراز هویت واقعی در مرحله اتصال به سرویس مدیریت فعال می‌شود.')">ورود به پنل</button><div class="note">این صفحه عمداً بدون رمز ثابت یا احراز هویت جعلی ساخته شده است. برای امنیت واقعی، مرحله بعد به سرویس احراز هویت و پایگاه داده متصل می‌شود تا بارگذاری و مدیریت فایل‌ها واقعاً امن باشد.</div><a class="back" href="index.html">بازگشت به سایت عمومی</a></main></body></html>
